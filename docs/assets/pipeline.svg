<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-labelledby="title desc">
<title id="title">Humanness Voice Annotator pipeline</title><desc id="desc">Audio is processed by Parakeet, Humaneness Ears, and two MOSS adapters. Procedural cues and a timing verifier combine their outputs into a GENERAL and SCRIPT annotation plus exact JSON.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#6d8d9a"/></marker></defs>
<rect width="1040" height="330" rx="18" fill="#f5f8f9"/>
<g stroke="#6d8d9a" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M155 165H185V50H218"/><path d="M185 165V125H218"/><path d="M185 165V205H218"/><path d="M185 165V280H218"/><path d="M455 50H488V165H518"/><path d="M455 125H518"/><path d="M455 205H488V185H518"/><path d="M455 280H488V205H518"/><path d="M768 165H809"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle">
<rect x="25" y="126" width="130" height="78" rx="12" fill="#173041"/><text x="90" y="159" fill="white" font-size="18" font-weight="700">Audio</text><text x="90" y="182" fill="#d8e8ec" font-size="12">original hash retained</text>
<rect x="218" y="18" width="237" height="64" rx="10" fill="#e1eefb" stroke="#c3d9ee"/><text x="336" y="44" fill="#215caa" font-size="15" font-weight="650">Parakeet v3</text><text x="336" y="66" fill="#526979" font-size="12">words · sentence / word endpoints</text>
<rect x="218" y="94" width="237" height="64" rx="10" fill="#e2f3ed" stroke="#b9dbcf"/><text x="336" y="120" fill="#096968" font-size="15" font-weight="650">Humaneness Ears Medium</text><text x="336" y="142" fill="#526979" font-size="12">scores · local cues · event locations</text>
<rect x="218" y="174" width="237" height="64" rx="10" fill="#fff0e2" stroke="#ead0b9"/><text x="336" y="200" fill="#9b531c" font-size="15" font-weight="650">MOSS voice adapter</text><text x="336" y="222" fill="#526979" font-size="12">whole-recording description</text>
<rect x="218" y="250" width="237" height="64" rx="10" fill="#eeeafd" stroke="#d2c8eb"/><text x="336" y="276" fill="#6651a0" font-size="15" font-weight="650">MOSS burst adapter</text><text x="336" y="298" fill="#526979" font-size="12">full audio + start / end → prose</text>
<rect x="518" y="105" width="250" height="125" rx="12" fill="white" stroke="#c8d7de"/><text x="643" y="137" fill="#173041" font-size="16" font-weight="700">Compose + verify</text><text x="643" y="163" fill="#526979" font-size="12">reference z-scores → compact tags</text><text x="643" y="184" fill="#526979" font-size="12">align speech · preserve overlaps</text><text x="643" y="205" fill="#526979" font-size="12">check every word and time budget</text>
<rect x="809" y="113" width="205" height="107" rx="12" fill="#096968"/><text x="912" y="147" fill="white" font-size="17" font-weight="700">GENERAL / SCRIPT</text><text x="912" y="174" fill="#d9efeb" font-size="12">readable performance annotation</text><text x="912" y="197" fill="#d9efeb" font-size="12">+ canonical JSON sidecar</text>
</g></svg>
